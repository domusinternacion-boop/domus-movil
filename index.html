<!doctype html><html lang=es><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel=apple-touch-icon href="icon-192.png"><meta name=theme-color content="#6c3a20"><meta name=apple-mobile-web-app-capable content=yes><title>Domus Móvil</title>
<style>
:root{--c:#8a4b2a;--c2:#6c3a20;--o:#6e7432;--f:#f6f1ea;--b:#e7e0d6;--t:#2d2722;--s:#7b6f63}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--f);color:var(--t);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--c2);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px}
header b{font-size:17px}header small{opacity:.8;display:block;font-size:12px}header button{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px}
main{padding:12px;max-width:640px;margin:auto}.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--b);background:#fff}.tabs .on{background:var(--c);color:#fff;border-color:var(--c)}
h3{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--c)}
label{display:block;font-size:13px;color:var(--s);margin-top:6px}input,textarea,select{width:100%;font:inherit;padding:9px;border:1px solid #d6ccbf;border-radius:8px;background:#fff;margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;font:600 16px system-ui;margin-top:10px;color:#fff;background:var(--c)}
.btn.o{background:var(--o)}.btn.l{background:#fff;color:var(--c);border:1.5px solid var(--c)}.btn:disabled{opacity:.5}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#f4e6d2;color:#7a5530}.ok{background:#e4ecd0;color:#4d5320}
.muted{color:var(--s);font-size:13px}.fotos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.fotos div{position:relative;width:74px;height:74px;border-radius:8px;overflow:hidden;background:#efe3d3;display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center}
.fotos img{width:100%;height:100%;object-fit:cover}.fotos button{position:absolute;top:2px;right:2px;border:0;border-radius:99px;width:22px;height:22px;background:#000a;color:#fff}
.adj{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.adj label{margin:0;text-align:center;padding:10px 4px;border:1.5px dashed var(--c);border-radius:10px;color:var(--c);font-weight:600;font-size:13px}.adj input{display:none}
#msg{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--t);color:#fff;padding:12px;border-radius:10px;display:none;z-index:9}
a{color:var(--c)}.tareas{white-space:pre-line;font-size:14px;background:#fbf5ec;border-radius:8px;padding:8px;margin-top:6px}
</style></head><body>
<header><div><b>Domus Móvil</b><small id=quien>Internación Domiciliaria</small></div><button onclick="cargar()">↻</button></header>
<main id=app><p class=muted>Cargando…</p></main><div id=msg></div>
<script>
const BUZON='https://script.google.com/macros/s/AKfycby_N78YQUCoG5aASzB-6pHOvyJ72neLMvPS7tvmek6lnu8_uckGbXDTORxUO9qF9Lf9dw/exec';
const LSj=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};
const T=new URLSearchParams(location.search).get('t')||LSj('token')||localStorage.getItem('t');if(T){localStorage.setItem('token',JSON.stringify(T));localStorage.setItem('t',T)}
(()=>{const c=LSj('cola');if(c&&c.length){localStorage.setItem('pend',JSON.stringify((LSj('pend')||[]).concat(c)));localStorage.removeItem('cola')}})(); // partes de la versión anterior
(()=>{const b=location.origin+location.pathname.replace(/index\.html$/,''),m={name:'Domus Prestadores',short_name:'Domus',display:'standalone',scope:b,start_url:b+(T?'?t='+T:''),background_color:'#f6f1ea',theme_color:'#6c3a20',
 icons:[{src:b+'icon-192.png',sizes:'192x192',type:'image/png'},{src:b+'icon-512.png',sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
 const l=document.createElement('link');l.rel='manifest';l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));document.head.appendChild(l)})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
let YO={},DIRS=[],cur=null,fotos=[],llegada=null,tab='visitas';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(m._t);m._t=setTimeout(()=>m.style.display='none',3500)};
const ahora=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`};
const fd=v=>{v=String(v||'');const d=v.slice(0,10).split('-');return d.length==3?`${d[2]}/${d[1]}`+v.slice(10,16):v};
async function api(o){const r=await fetch(BUZON,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({t:T},o))});const j=await r.json();if(!j.ok)throw Error(j.error);return j}

/* Formularios por rol: las claves coinciden con los formularios de Domus ID (PC) */
const V=[['ta','Tensión arterial'],['fc','Frec. cardíaca'],['fr','Frec. respiratoria'],['temp','Temperatura °C'],['sat','Saturación O₂ %'],['glucemia','Glucemia mg/dl']];
const F={
 medico:{t:'Visita médica',vit:V,c:[['motivo','Motivo de la visita'],['examen','Examen físico',3],['diagnostico','Diagnóstico / impresión clínica',2],['indicaciones','Indicaciones y tratamiento',3],['medicacion','Medicación indicada (droga, dosis, vía, frecuencia)',2],['estudios','Estudios solicitados'],['proxima','Próxima visita sugerida']],evol:1},
 auditoria:{t:'Auditoría de terreno',vit:[],c:[['centro','Institución donde está internado'],['estado','Estado general del afiliado',3],['dispositivos','Dispositivos / requerimientos para externar (O₂, sondas, cama, etc.)',2],['recomendacion','Recomendación del auditor',2],['obs','Observaciones',2]],fotoT:'Fotos de historia clínica / epicrisis',nf:8,noIns:1},
 enfermeria:{t:'Enfermería',vit:V,c:[['procedimientos','Procedimientos realizados (curaciones, medicación aplicada: droga, dosis, vía)',3],['heridas','Estado de piel y heridas',2],['novedades','Novedades',2]],ins:1},
 cuidador:{t:'Cuidador/a',vit:[],c:[['Turno / horario','Turno / horario'],['Alimentación','Alimentación'],['Higiene','Higiene'],['Rotación / movilización','Rotación / movilización'],['Diuresis / deposiciones','Diuresis / deposiciones'],['novedades','Novedades',3]],ins:1},
 kinesiologia:{t:'Kinesiología',vit:[['sat','Saturación O₂ %'],['fc','Frec. cardíaca']],c:[['Tipo de sesión','Tipo (motora / respiratoria)'],['Duración','Duración'],['evaluacion','Evaluación funcional',2],['plan','Plan / objetivos',2],['obs','Observaciones',2]]},
 visita:{t:'Visita domiciliaria',vit:[['ta','Tensión arterial'],['fc','Frec. cardíaca']],c:[['motivo','Motivo de la visita'],['evaluacion','Evaluación',3],['intervencion','Intervención realizada',3],['plan','Plan y objetivos',2],['obs','Observaciones',2]],ins:1}};
const tipo=r=>/m[eé]dic|especialista|fisiatra/i.test(r)?'medico':/auditor/i.test(r)?'auditoria':/enfermer/i.test(r)?'enfermeria':/cuidador|acompa/i.test(r)?'cuidador':/kinesi/i.test(r)?'kinesiologia':'visita';

async function cargar(){
 if(!T){$('#app').innerHTML='<div class=card>Abrí el link personal que te mandó Domus por WhatsApp.</div>';return}
 enviarPendientes();
 try{const j=await api({a:'yo'});YO=j;DIRS=j.directivas||[];localStorage.setItem('yo',JSON.stringify(j))}
 catch(e){const c=localStorage.getItem('yo');if(c){YO=JSON.parse(c);DIRS=YO.directivas||[];toast('Sin conexión: mostrando lo último guardado')}else{$('#app').innerHTML=`<div class=card>⚠ ${esc(e.message)}</div>`;return}}
 $('#quien').textContent=`${YO.nombre} · ${YO.rol}`;cur?form(cur.id):lista()}

function tabs(){return`<div class=tabs><button class="${tab=='visitas'?'on':''}" onclick="tab='visitas';lista()">Visitas (${DIRS.length})</button><button class="${tab=='hist'?'on':''}" onclick="tab='hist';hist()">Partes enviados</button></div>`}
function lista(){cur=null;const p=pend().length;
 $('#app').innerHTML=tabs()+(p?`<div class="card muted">⏳ ${p} parte(s) esperando señal para enviarse.</div>`:'')+(DIRS.map(d=>`<div class=card onclick="form('${d.id}')"><div style="display:flex;justify-content:space-between"><b>${esc(d.paciente)}</b><span class="pill ${d.estado=='vista'?'ok':''}">${fd(d.fecha)} ${esc(d.hora)}</span></div>
 <div class=muted>${esc(d.domicilio)}</div><div class=muted>${esc(d.tareas)}</div></div>`).join('')||'<div class="card muted">No tenés visitas pendientes.</div>')}

async function hist(){$('#app').innerHTML=tabs()+'<p class=muted>Cargando…</p>';
 try{const j=await api({a:'historial'});$('#app').innerHTML=tabs()+(j.partes.map(x=>`<div class=card><b>${esc(x.paciente)}</b> <span class="pill ${x.resultado=='realizada'?'ok':''}">${esc(x.resultado)}</span><div class=muted>${fd(x.llegada)} · ${x.fotos} adjunto(s)</div><div class=muted>${esc((x.evolucion||x.motivo||'').slice(0,140))}</div></div>`).join('')||'<div class="card muted">Sin partes.</div>')}
 catch(e){toast(e.message)}}

function campo([k,l,h]){return h>1?`<label>${l}<textarea name="c:${esc(k)}" rows=${h}></textarea></label>`:`<label>${l}<input name="c:${esc(k)}"></label>`}
function form(id){const d=DIRS.find(x=>x.id==id);if(!d)return lista();cur=d;fotos=[];llegada=null;const f=F[tipo(YO.rol)];
 if(d.estado=='pendiente')api({a:'visto',id}).catch(()=>{});
 const tel=d.tel_afiliado?`<a href="tel:${esc(d.tel_afiliado)}">📞 ${esc(d.tel_afiliado)}</a>`:'';
 $('#app').innerHTML=`<button class="btn l" style="margin:0 0 10px" onclick="lista()">← Volver</button>
 <div class=card><b style="font-size:18px">${esc(d.paciente)}</b><div><a target=_blank href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.domicilio)}">📍 ${esc(d.domicilio)}</a></div>
 <div class=muted>${fd(d.fecha)} ${esc(d.hora)} · ${esc(d.dni)} ${tel}</div><div class=tareas><b>${esc(d.tareas)}</b>${d.notas?'\n'+esc(d.notas):''}</div></div>
 <form id=fm class=card onsubmit="event.preventDefault();enviar()"><span class=pill>${f.t}</span>
 <h3>Llegada</h3><button type=button id=bll class="btn o" onclick="llegar()">Registrar llegada</button>
 <h3>Resultado</h3><select name=resultado onchange="$('#mot').style.display=this.value=='no_realizada'?'block':'none'"><option value=realizada>Visita realizada</option><option value=no_realizada>No se pudo realizar</option></select>
 <label id=mot style="display:none">Motivo<input name=motivo></label>
 ${f.vit.length?'<h3>Signos vitales</h3><div class=g2>'+f.vit.map(([k,l])=>`<label>${l}<input name="${k}" inputmode=${k=='ta'?'text':'decimal'}></label>`).join('')+'</div>':''}
 <h3>${f.t}</h3>${f.c.map(campo).join('')}
 ${f.evol?'<label>Evolución / indicaciones a la familia<textarea name=evolucion rows=3></textarea></label>':''}
 ${f.ins?'<label>Insumos utilizados<input name=insumos placeholder="Ej.: 2 gasas, 1 jeringa"></label>':''}
 <h3>${f.fotoT||'Fotos y documentos'} <span class=muted>(hasta ${f.nf||4})</span></h3>
 <div class=adj><label>📷 Cámara<input type=file accept="image/*" capture=environment onchange="adjuntar(this)"></label><label>🖼 Galería<input type=file accept="image/*" multiple onchange="adjuntar(this)"></label><label>📎 Archivo<input type=file accept="image/*,application/pdf" multiple onchange="adjuntar(this)"></label></div>
 <div class=fotos id=fotos></div><button class=btn id=benv>Finalizar y enviar parte</button></form>`;scrollTo(0,0)}

function llegar(){llegada={t:ahora()};$('#bll').textContent='✔ Llegada '+llegada.t.slice(11,16);$('#bll').disabled=true;
 navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{llegada.lat=p.coords.latitude.toFixed(6);llegada.lng=p.coords.longitude.toFixed(6)},()=>{},{timeout:8000})}

function comprimir(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{if(!file.type.startsWith('image/'))return ok(r.result);
 const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.75))};im.onerror=()=>ok(r.result);im.src=r.result};r.readAsDataURL(file)})}
async function adjuntar(inp){const max=F[tipo(YO.rol)].nf||4;for(const f of inp.files){if(fotos.length>=max){toast('Máximo '+max+' archivos');break}
 if(f.size>15e6){toast(f.name+': muy pesado');continue}fotos.push({n:f.name,d:await comprimir(f)})}inp.value='';verFotos()}
function verFotos(){$('#fotos').innerHTML=fotos.map((x,i)=>`<div>${x.d.startsWith('data:image')?`<img src="${x.d}">`:'📄 PDF'}<button type=button onclick="fotos.splice(${i},1);verFotos()">×</button></div>`).join('')}

const pend=()=>JSON.parse(localStorage.getItem('pend')||'[]'),setPend=p=>localStorage.setItem('pend',JSON.stringify(p));
async function enviarPendientes(){let p=pend(),q=[];for(const inf of p){try{await api({a:'informe',informe:inf})}catch(e){if(!/no pertenece|eliminada/i.test(e.message))q.push(inf)}}setPend(q)}

async function enviar(){const fm=new FormData($('#fm')),f=F[tipo(YO.rol)],res=fm.get('resultado');
 if(!llegada&&res=='realizada'){toast('Primero tocá «Registrar llegada»');return}
 const campos={};for(const[k,v]of fm)if(k.startsWith('c:')&&v.trim())campos[k.slice(2)]=v.trim();
 const inf={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),directiva_id:cur.id,llegada:llegada?llegada.t:ahora(),lat:llegada?.lat||'',lng:llegada?.lng||'',salida:ahora(),
  resultado:res,motivo:fm.get('motivo')||'',evolucion:fm.get('evolucion')||campos.estado||campos.novedades||campos.evaluacion||'',procedimientos:campos.procedimientos||'',insumos:fm.get('insumos')||'',
  fotos:fotos.map(x=>x.d),campos};
 for(const k of['ta','fc','fr','temp','sat','glucemia','dolor'])inf[k]=fm.get(k)||'';
 $('#benv').disabled=true;$('#benv').textContent='Enviando…';
 try{await api({a:'informe',informe:inf});toast('✔ Parte enviado a Domus')}
 catch(e){if(/no pertenece|eliminada|inválido/i.test(e.message)){toast('⚠ '+e.message);$('#benv').disabled=false;$('#benv').textContent='Finalizar y enviar parte';return}
  setPend(pend().concat([inf]));toast('Sin señal: el parte se enviará solo al volver la conexión')}
 DIRS=DIRS.filter(x=>x.id!=cur.id);cur=null;lista()}
addEventListener('online',()=>enviarPendientes().then(()=>!cur&&tab=='visitas'&&lista()));
cargar();setInterval(()=>{if(!cur&&tab=='visitas')cargar()},120000);
</script></body></html>
